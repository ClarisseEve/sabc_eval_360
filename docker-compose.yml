services:
  frontend:
    build:
      context: ./apps/web
      dockerfile: Dockerfile
    container_name: sabc-frontend
    ports:
      - "5173:80"
    depends_on:
      - nestjs-api
    networks:
      - sabc-network

  nestjs-api:
    build:
      context: ./apps/api
      dockerfile: Dockerfile
    container_name: sabc-nestjs-api
    environment:
      PORT: 3000
      FRONTEND_URL: http://localhost:5173
      JWT_SECRET: ${JWT_SECRET:-CHANGE_ME}
      DATABASE_URL: ${DATABASE_URL:-mysql://sabc_user:secret@mysql:3306/sabc_core}
      PG_HOST: postgres
      PG_PORT: 5432
      PG_DATABASE: ${PG_DATABASE:-sabc_business}
      PG_USER: ${PG_USER:-sabc_user}
      PG_PASSWORD: ${PG_PASSWORD:-***REMOVED***}
    ports:
      - "3000:3000"
    depends_on:
      mysql:
        condition: service_healthy
      postgres:
        condition: service_healthy
    networks:
      - sabc-network

  mysql:
    image: mysql:8.0
    container_name: sabc-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-***REMOVED***}
      MYSQL_DATABASE: sabc_core
      MYSQL_USER: sabc_user
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-***REMOVED***}
    ports:
      - "3306:3306"
    volumes:
      - mysql-data:/var/lib/mysql
      - ./docker/mysql/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-p${MYSQL_ROOT_PASSWORD:-***REMOVED***}"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - sabc-network

  postgres:
    image: postgres:16
    container_name: sabc-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${PG_DATABASE:-sabc_business}
      POSTGRES_USER: ${PG_USER:-sabc_user}
      POSTGRES_PASSWORD: ${PG_PASSWORD:-***REMOVED***}
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./docker/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${PG_USER:-sabc_user} -d ${PG_DATABASE:-sabc_business}"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - sabc-network

volumes:
  mysql-data:
  postgres-data:

networks:
  sabc-network:
    driver: bridge
