# SABC Eval360 - Docker Compose Architecture Microservices
# Version: Phase 3 - Analytics Service Extraction (Strangler Pattern)
#
# Architecture:
#   ┌─────────────────────────────────────────────────────────────────────┐
#   │                         Traefik Gateway                            │
#   │                    (Routing + Load Balancing)                      │
#   └────────────────────────────┬──────────────────────────────────────┘
#                                │
#      ┌──────────┬──────────────┼──────────────┬──────────────┐
#      │          │              │              │              │
#  ┌───▼────┐ ┌──▼───────┐ ┌───▼─────┐  ┌─────▼─────┐  ┌────▼────┐
#  │  Core  │ │ NestJS   │ │Analytics│  │ Evaluation│  │  Redis  │
#  │ Laravel│ │  API     │ │ Service │  │ Service   │  │  Cache  │
#  │(legacy)│ │(v3 new)  │ │  (Go)   │  │  (Go)     │  │         │
#  └───┬────┘ └──┬───┬───┘ └───┬─────┘  └─────┬─────┘  └─────────┘
#      │         │   │         │               │
#  ┌───▼─────────▼┐ │    ┌────▼──────┐  ┌─────▼─────┐
#  │   MySQL      │ │    │ClickHouse │  │PostgreSQL │
#  │  (CORE)      │ │    │(ANALYTICS)│  │ (BUSINESS)│
#  └──────────────┘ │    └───────────┘  └─────▲─────┘
#                   └─────────────────────────┘

services:
  # =============================================================================
  # API GATEWAY - Point d'entrée unique
  # =============================================================================
  gateway:
    image: traefik:v3.0
    container_name: sabc-gateway
    profiles: [gateway]
    command:
      - "--api.dashboard=true"
      - "--api.insecure=true"
      - "--providers.docker=true"
      - "--providers.docker.exposedbydefault=false"
      - "--entrypoints.web.address=:80"
      - "--entrypoints.websecure.address=:443"
      - "--metrics.prometheus=true"
      - "--tracing.jaeger=true"
      - "--tracing.jaeger.samplingServerURL=http://jaeger:5778/sampling"
      - "--accesslog=true"
      - "--accesslog.format=json"
    ports:
      - "80:80"
      - "443:443"
      - "8080:8080"  # Dashboard Traefik
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ./docker/traefik/traefik.yml:/etc/traefik/traefik.yml:ro
    networks:
      - sabc-network
    depends_on:
      - core-app
      - nestjs-api
      - evaluation-service
      - analytics-service
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.dashboard.rule=Host(`traefik.localhost`)"
      - "traefik.http.routers.dashboard.service=api@internal"

  # =============================================================================
  # CORE APPLICATION - Monolithe Laravel (Strangler Pattern)
  # =============================================================================
  core-app:
    build:
      context: .
      dockerfile: docker/Dockerfile
      target: app
    container_name: sabc-core-app
    restart: unless-stopped
    environment:
      - APP_ENV=local
      - APP_DEBUG=true
      - APP_KEY=${APP_KEY}
      - APP_URL=http://localhost
      # MySQL (CORE)
      - DB_CONNECTION=mysql
      - DB_HOST=mysql
      - DB_PORT=3306
      - DB_DATABASE=sabc_core
      - DB_USERNAME=sabc_user
      - DB_PASSWORD=${DB_PASSWORD:-***REMOVED***}
      # PostgreSQL (BUSINESS)
      - DB_PGSQL_HOST=postgres
      - DB_PGSQL_PORT=5432
      - DB_PGSQL_DATABASE=sabc_business
      - DB_PGSQL_USERNAME=sabc_user
      - DB_PGSQL_PASSWORD=${DB_PASSWORD:-***REMOVED***}
      # ClickHouse (ANALYTICS)
      - CLICKHOUSE_HOST=clickhouse
      - CLICKHOUSE_PORT=8123
      - CLICKHOUSE_DATABASE=sabc_analytics
      - CLICKHOUSE_USERNAME=default
      - CLICKHOUSE_PASSWORD=${CLICKHOUSE_PASSWORD:-}
      # Redis
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - REDIS_PASSWORD=${REDIS_PASSWORD:-null}
      # Queue
      - QUEUE_CONNECTION=redis
      # Session
      - SESSION_DRIVER=redis
      # Cache
      - CACHE_STORE=redis
      # Logging
      - LOG_CHANNEL=stack
      - LOG_LEVEL=debug
      # Service Discovery
      - SERVICE_NAME=core-app
      - JAEGER_ENABLED=${JAEGER_ENABLED:-true}
      - JAEGER_SERVICE_NAME=${JAEGER_SERVICE_NAME:-core-app}
      - JAEGER_AGENT_HOST=jaeger
      - JAEGER_AGENT_PORT=6831
      - JAEGER_SAMPLER_TYPE=${JAEGER_SAMPLER_TYPE:-const}
      - JAEGER_SAMPLER_PARAM=${JAEGER_SAMPLER_PARAM:-1}
      - JAEGER_LOG_SPANS=${JAEGER_LOG_SPANS:-false}
      # Evaluation Microservice (Strangler Pattern)
      - EVALUATION_SERVICE_URL=http://evaluation-service:8080
      - EVALUATION_SERVICE_GRPC=evaluation-service:50051
      - EVALUATION_SERVICE_KEY=${SERVICE_KEY:-internal-service-key}
      # Analytics Microservice (Strangler Pattern)
      - ANALYTICS_MICROSERVICE_ENABLED=${ANALYTICS_MICROSERVICE_ENABLED:-false}
      - ANALYTICS_SERVICE_URL=http://analytics-service:8080
      - ANALYTICS_SERVICE_KEY=${ANALYTICS_SERVICE_KEY:-internal-service-key}
      - ANALYTICS_SERVICE_TIMEOUT=60
    volumes:
      - .:/var/www/html
      - ./storage:/var/www/html/storage
      - ./bootstrap/cache:/var/www/html/bootstrap/cache
    networks:
      - sabc-network
    depends_on:
      mysql:
        condition: service_healthy
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      clickhouse:
        condition: service_healthy
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.core-app.rule=Host(`localhost`) || Host(`sabc.localhost`)"
      - "traefik.http.routers.core-app.entrypoints=web"
      - "traefik.http.services.core-app.loadbalancer.server.port=80"
      # Middleware pour rate limiting
      - "traefik.http.middlewares.core-ratelimit.ratelimit.average=100"
      - "traefik.http.middlewares.core-ratelimit.ratelimit.burst=50"
      - "traefik.http.routers.core-app.middlewares=core-ratelimit"

  # =============================================================================
  # QUEUE WORKERS - Traitement asynchrone par domaine
  # =============================================================================
  # queue-worker-* et scheduler sont gérés par supervisord dans core-app (dev).
  # Ajouter le profile "scale-workers" pour les lancer en conteneurs séparés (prod).
  queue-worker-default:
    build:
      context: .
      dockerfile: docker/Dockerfile
      target: app
    container_name: sabc-queue-default
    profiles: [scale-workers]
    restart: unless-stopped
    command: php artisan queue:work redis --queue=default,notifications --sleep=3 --tries=3 --max-time=3600
    environment:
      - APP_ENV=local
      - DB_HOST=mysql
      - DB_PGSQL_HOST=postgres
      - REDIS_HOST=redis
      - QUEUE_CONNECTION=redis
    volumes:
      - .:/var/www/html
    networks:
      - sabc-network
    depends_on:
      - core-app
      - redis

  queue-worker-evaluations:
    build:
      context: .
      dockerfile: docker/Dockerfile
      target: app
    container_name: sabc-queue-evaluations
    profiles: [scale-workers]
    restart: unless-stopped
    command: php artisan queue:work redis --queue=evaluations,scores --sleep=3 --tries=3 --max-time=3600
    environment:
      - APP_ENV=local
      - DB_HOST=mysql
      - DB_PGSQL_HOST=postgres
      - REDIS_HOST=redis
      - QUEUE_CONNECTION=redis
    volumes:
      - .:/var/www/html
    networks:
      - sabc-network
    depends_on:
      - core-app
      - redis

  queue-worker-analytics:
    build:
      context: .
      dockerfile: docker/Dockerfile
      target: app
    container_name: sabc-queue-analytics
    profiles: [scale-workers]
    restart: unless-stopped
    command: php artisan queue:work redis --queue=analytics,sync --sleep=3 --tries=3 --max-time=3600
    environment:
      - APP_ENV=local
      - DB_HOST=mysql
      - DB_PGSQL_HOST=postgres
      - CLICKHOUSE_HOST=clickhouse
      - REDIS_HOST=redis
      - QUEUE_CONNECTION=redis
    volumes:
      - .:/var/www/html
    networks:
      - sabc-network
    depends_on:
      - core-app
      - redis
      - clickhouse

  scheduler:
    build:
      context: .
      dockerfile: docker/Dockerfile
      target: app
    container_name: sabc-scheduler
    profiles: [scale-workers]
    restart: unless-stopped
    command: >
      sh -c "while true; do php artisan schedule:run --verbose --no-interaction; sleep 60; done"
    environment:
      - APP_ENV=local
      - DB_HOST=mysql
      - REDIS_HOST=redis
    volumes:
      - .:/var/www/html
    networks:
      - sabc-network
    depends_on:
      - core-app

  # =============================================================================
  # DATABASES
  # =============================================================================
  mysql:
    image: mysql:8.0
    container_name: sabc-mysql
    restart: unless-stopped
    environment:
      - MYSQL_ROOT_PASSWORD=${MYSQL_ROOT_PASSWORD:-***REMOVED***}
      - MYSQL_DATABASE=sabc_core
      - MYSQL_USER=sabc_user
      - MYSQL_PASSWORD=${DB_PASSWORD:-***REMOVED***}
    ports:
      - "3307:3306"  # Hôte:3307 → évite conflits avec MySQL local (3306)
    volumes:
      - mysql_data:/var/lib/mysql
      - ./docker/mysql/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    networks:
      - sabc-network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${MYSQL_ROOT_PASSWORD:-***REMOVED***}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  postgres:
    image: postgres:16-alpine
    container_name: sabc-postgres
    restart: unless-stopped
    environment:
      - POSTGRES_DB=sabc_business
      - POSTGRES_USER=sabc_user
      - POSTGRES_PASSWORD=${DB_PASSWORD:-***REMOVED***}
    ports:
      - "5433:5432"  # Hôte:5433 → évite conflits avec PostgreSQL local (5432)
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    networks:
      - sabc-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sabc_user -d sabc_business"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  clickhouse:
    image: clickhouse/clickhouse-server:24.1
    container_name: sabc-clickhouse
    restart: unless-stopped
    environment:
      - CLICKHOUSE_DB=sabc_analytics
      - CLICKHOUSE_USER=default
      - CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT=1
    ports:
      - "8124:8123"  # HTTP  → Hôte:8124 évite conflits avec ClickHouse OrbStack (8123)
      - "9001:9000"  # Native → Hôte:9001 évite conflits avec ClickHouse OrbStack (9000)
    volumes:
      - clickhouse_data:/var/lib/clickhouse
      - clickhouse_logs:/var/log/clickhouse-server
      - ./docker/clickhouse/config.xml:/etc/clickhouse-server/config.d/config.xml:ro
      - ./docker/clickhouse/users.xml:/etc/clickhouse-server/users.d/users.xml:ro
    networks:
      - sabc-network
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:8123/ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    ulimits:
      nofile:
        soft: 262144
        hard: 262144

  clickhouse-init:
    image: clickhouse/clickhouse-server:24.1
    container_name: sabc-clickhouse-init
    restart: "no"
    depends_on:
      clickhouse:
        condition: service_healthy
    volumes:
      - ./database/clickhouse/create_analytics_tables.sql:/docker-entrypoint-initdb.d/init.sql:ro
    entrypoint:
      - /bin/sh
      - -c
      - "clickhouse-client --host clickhouse --multiquery < /docker-entrypoint-initdb.d/init.sql"
    networks:
      - sabc-network

  # =============================================================================
  # CACHE & MESSAGING
  # =============================================================================
  redis:
    image: redis:7-alpine
    container_name: sabc-redis
    restart: unless-stopped
    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - sabc-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis-exporter:
    image: oliver006/redis_exporter:v1.61.0
    container_name: sabc-redis-exporter
    profiles: [observability]
    restart: unless-stopped
    environment:
      - REDIS_ADDR=redis://redis:6379
      - REDIS_PASSWORD=${REDIS_PASSWORD:-}
    networks:
      - sabc-network
    depends_on:
      redis:
        condition: service_healthy

  # =============================================================================
  # PYTHON DATA PIPELINE (basé sur data_pipelines/requirements.txt)
  # =============================================================================
  python-pipeline:
    build:
      context: ./data_pipelines
      dockerfile: Dockerfile
    container_name: sabc-python-pipeline
    profiles: [pipeline]
    restart: unless-stopped
    environment:
      - MYSQL_HOST=mysql
      - MYSQL_PORT=3306
      - MYSQL_DATABASE=sabc_core
      - MYSQL_USER=sabc_user
      - MYSQL_PASSWORD=${DB_PASSWORD:-***REMOVED***}
      - POSTGRES_HOST=postgres
      - POSTGRES_PORT=5432
      - POSTGRES_DATABASE=sabc_business
      - POSTGRES_USER=sabc_user
      - POSTGRES_PASSWORD=${DB_PASSWORD:-***REMOVED***}
      - CLICKHOUSE_HOST=clickhouse
      - CLICKHOUSE_PORT=8123
      - CLICKHOUSE_DATABASE=sabc_analytics
      - REDIS_HOST=redis
      - REDIS_PORT=6379
    volumes:
      - ./data_pipelines:/app
    networks:
      - sabc-network
    depends_on:
      - mysql
      - postgres
      - clickhouse
      - redis

  # =============================================================================
  # OBSERVABILITY STACK
  # =============================================================================
  jaeger:
    image: jaegertracing/all-in-one:1.53
    container_name: sabc-jaeger
    profiles: [observability]
    restart: unless-stopped
    ports:
      - "5775:5775/udp"   # Zipkin compact thrift
      - "6831:6831/udp"   # Thrift compact
      - "6832:6832/udp"   # Thrift binary
      - "5778:5778"       # Config
      - "16686:16686"     # Web UI
      - "14268:14268"     # Collector HTTP
      - "14250:14250"     # gRPC
    environment:
      - COLLECTOR_OTLP_ENABLED=true
    networks:
      - sabc-network

  prometheus:
    image: prom/prometheus:v2.48.0
    container_name: sabc-prometheus
    profiles: [observability]
    restart: unless-stopped
    ports:
      - "9090:9090"
    volumes:
      - ./docker/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./docker/prometheus/alerts:/etc/prometheus/alerts:ro
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.enable-lifecycle'
      - '--web.enable-admin-api'
    networks:
      - sabc-network
    depends_on:
      - alertmanager

  alertmanager:
    image: prom/alertmanager:v0.26.0
    container_name: sabc-alertmanager
    profiles: [observability]
    restart: unless-stopped
    ports:
      - "9093:9093"
    volumes:
      - ./docker/alertmanager/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
      - ./docker/alertmanager/templates:/etc/alertmanager/templates:ro
      - alertmanager_data:/alertmanager
    command:
      - '--config.file=/etc/alertmanager/alertmanager.yml'
      - '--storage.path=/alertmanager'
      - '--web.external-url=http://localhost:9093'
    environment:
      - SMTP_HOST=${SMTP_HOST:-smtp.example.com}
      - SMTP_PORT=${SMTP_PORT:-587}
      - SMTP_USER=${SMTP_USER:-}
      - SMTP_PASSWORD=${SMTP_PASSWORD:-}
      - SLACK_WEBHOOK_URL=${SLACK_WEBHOOK_URL:-}
    networks:
      - sabc-network

  grafana:
    image: grafana/grafana:10.2.2
    container_name: sabc-grafana
    profiles: [observability]
    restart: unless-stopped
    ports:
      - "3001:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_PASSWORD:-admin}
      - GF_USERS_ALLOW_SIGN_UP=false
      - GF_INSTALL_PLUGINS=grafana-clickhouse-datasource
    volumes:
      - grafana_data:/var/lib/grafana
      - ./docker/grafana/provisioning:/etc/grafana/provisioning:ro
    networks:
      - sabc-network
    depends_on:
      - prometheus

  # =============================================================================
  # NESTJS API (Phase 4 - Strangler Pattern replacement for Laravel)
  # =============================================================================
  nestjs-api:
    build:
      context: ./apps/api
      dockerfile: Dockerfile
    container_name: sabc-nestjs-api
    restart: unless-stopped
    environment:
      # Server
      - PORT=3000
      # MySQL (Prisma - CORE)
      - DATABASE_URL=mysql://sabc_user:${DB_PASSWORD:-***REMOVED***}@mysql:3306/sabc_core
      # PostgreSQL (BUSINESS)
      - PG_HOST=postgres
      - PG_PORT=5432
      - PG_DATABASE=sabc_business
      - PG_USER=sabc_user
      - PG_PASSWORD=${DB_PASSWORD:-***REMOVED***}
      # Auth
      - JWT_SECRET=${JWT_SECRET:-your-jwt-secret}
      - JWT_EXPIRATION=24h
      # Analytics microservice (Strangler proxy)
      - ANALYTICS_MICROSERVICE_ENABLED=${ANALYTICS_MICROSERVICE_ENABLED:-false}
      - ANALYTICS_SERVICE_URL=http://analytics-service:8080
      - ANALYTICS_SERVICE_KEY=${ANALYTICS_SERVICE_KEY:-internal-service-key}
      # Frontend CORS
      - FRONTEND_URL=http://localhost
    ports:
      - "3000:3000"
    networks:
      - sabc-network
    depends_on:
      mysql:
        condition: service_healthy
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:3000/api"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
    labels:
      - "traefik.enable=true"
      # Route /api/v3/* to NestJS API (strangler: v3 = new NestJS endpoints)
      - "traefik.http.routers.nestjs-api.rule=Host(`localhost`) && PathPrefix(`/api/v3`)"
      - "traefik.http.routers.nestjs-api.entrypoints=web"
      - "traefik.http.services.nestjs-api.loadbalancer.server.port=3000"
      # Rate limiting
      - "traefik.http.middlewares.nestjs-ratelimit.ratelimit.average=100"
      - "traefik.http.middlewares.nestjs-ratelimit.ratelimit.burst=50"
      - "traefik.http.routers.nestjs-api.middlewares=nestjs-ratelimit"

  # =============================================================================
  # FRONTEND SPA (React + Vite, served by Nginx)
  # =============================================================================
  frontend:
    build:
      context: .
      dockerfile: docker/frontend/Dockerfile
    container_name: sabc-frontend
    restart: unless-stopped
    ports:
      - "5173:80"
    networks:
      - sabc-network
    depends_on:
      nestjs-api:
        condition: service_healthy
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.frontend.rule=Host(`localhost`) && !PathPrefix(`/api`)"
      - "traefik.http.routers.frontend.entrypoints=web"
      - "traefik.http.services.frontend.loadbalancer.server.port=80"

  # =============================================================================
  # EVALUATION MICROSERVICE (Phase 2 - Go)
  # =============================================================================
  evaluation-service:
    build:
      context: ./services/evaluation
      dockerfile: Dockerfile
    container_name: sabc-evaluation-service
    profiles: [microservices]
    restart: unless-stopped
    environment:
      # Server
      - EVAL_SERVER_HTTP_PORT=8080
      - EVAL_SERVER_GRPC_PORT=50051
      - EVAL_SERVER_ENVIRONMENT=${APP_ENV:-local}
      # Database (PostgreSQL)
      - EVAL_DATABASE_HOST=postgres
      - EVAL_DATABASE_PORT=5432
      - EVAL_DATABASE_DATABASE=sabc_business
      - EVAL_DATABASE_USERNAME=sabc_user
      - EVAL_DATABASE_PASSWORD=${DB_PASSWORD:-***REMOVED***}
      - EVAL_DATABASE_SSL_MODE=disable
      - EVAL_DATABASE_MAX_OPEN_CONNS=25
      - EVAL_DATABASE_MAX_IDLE_CONNS=5
      # Redis
      - EVAL_REDIS_HOST=redis
      - EVAL_REDIS_PORT=6379
      - EVAL_REDIS_PASSWORD=${REDIS_PASSWORD:-}
      # Auth
      - EVAL_AUTH_JWT_SECRET=${JWT_SECRET:-your-jwt-secret}
      - EVAL_AUTH_SERVICE_KEY=${SERVICE_KEY:-internal-service-key}
      - EVAL_AUTH_LARAVEL_APP_KEY=${APP_KEY}
      # Tracing
      - EVAL_TRACING_ENABLED=true
      - EVAL_TRACING_SERVICE_NAME=evaluation-service
      - EVAL_TRACING_AGENT_HOST=jaeger
      - EVAL_TRACING_AGENT_PORT=6831
      # Logging
      - EVAL_LOGGING_LEVEL=info
      - EVAL_LOGGING_FORMAT=json
    ports:
      - "8081:8080"   # HTTP API
      - "50051:50051" # gRPC
    networks:
      - sabc-network
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    labels:
      - "traefik.enable=true"
      # Route /api/v2/evaluations to evaluation service
      - "traefik.http.routers.evaluation.rule=Host(`localhost`) && PathPrefix(`/api/v2/evaluations`)"
      - "traefik.http.routers.evaluation.entrypoints=web"
      - "traefik.http.services.evaluation.loadbalancer.server.port=8080"
      # Route /api/v2/periodes to evaluation service
      - "traefik.http.routers.periodes.rule=Host(`localhost`) && PathPrefix(`/api/v2/periodes`)"
      - "traefik.http.routers.periodes.entrypoints=web"
      - "traefik.http.routers.periodes.service=evaluation"
      # Route /api/v2/scores to evaluation service
      - "traefik.http.routers.scores.rule=Host(`localhost`) && PathPrefix(`/api/v2/scores`)"
      - "traefik.http.routers.scores.entrypoints=web"
      - "traefik.http.routers.scores.service=evaluation"
      # Rate limiting
      - "traefik.http.middlewares.eval-ratelimit.ratelimit.average=50"
      - "traefik.http.middlewares.eval-ratelimit.ratelimit.burst=20"
      - "traefik.http.routers.evaluation.middlewares=eval-ratelimit"

  # =============================================================================
  # MICROSERVICES (Phase 3)
  # =============================================================================

  analytics-service:
    build:
      context: ./services/analytics
      dockerfile: Dockerfile
    container_name: sabc-analytics-service
    profiles: [microservices]
    restart: unless-stopped
    environment:
      # Server
      - ANALYTICS_SERVER_HTTP_PORT=8080
      - ANALYTICS_SERVER_ENVIRONMENT=${APP_ENV:-local}
      # ClickHouse
      - ANALYTICS_CLICKHOUSE_HOST=clickhouse
      - ANALYTICS_CLICKHOUSE_PORT=9000
      - ANALYTICS_CLICKHOUSE_DATABASE=sabc_analytics
      - ANALYTICS_CLICKHOUSE_USERNAME=default
      - ANALYTICS_CLICKHOUSE_PASSWORD=${CLICKHOUSE_PASSWORD:-}
      - ANALYTICS_CLICKHOUSE_DIAL_TIMEOUT=10s
      - ANALYTICS_CLICKHOUSE_MAX_OPEN_CONNS=10
      - ANALYTICS_CLICKHOUSE_MAX_IDLE_CONNS=5
      - ANALYTICS_CLICKHOUSE_CONN_MAX_LIFETIME=1h
      # Auth
      - ANALYTICS_AUTH_SERVICE_KEY=${ANALYTICS_SERVICE_KEY:-internal-service-key}
      # Tracing
      - ANALYTICS_TRACING_ENABLED=true
      - ANALYTICS_TRACING_SERVICE_NAME=analytics-service
      - ANALYTICS_TRACING_AGENT_HOST=jaeger
      - ANALYTICS_TRACING_AGENT_PORT=6831
      # Logging
      - ANALYTICS_LOGGING_LEVEL=info
      - ANALYTICS_LOGGING_FORMAT=json
    ports:
      - "8082:8080"
    networks:
      - sabc-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    labels:
      - "traefik.enable=true"
      # Route /api/v2/analytics to analytics service
      - "traefik.http.routers.analytics.rule=Host(`localhost`) && PathPrefix(`/api/v2/analytics`)"
      - "traefik.http.routers.analytics.entrypoints=web"
      - "traefik.http.services.analytics.loadbalancer.server.port=8080"
      # Rate limiting for analytics
      - "traefik.http.middlewares.analytics-ratelimit.ratelimit.average=50"
      - "traefik.http.middlewares.analytics-ratelimit.ratelimit.burst=25"
      - "traefik.http.routers.analytics.middlewares=analytics-ratelimit"
    depends_on:
      clickhouse:
        condition: service_healthy
      clickhouse-init:
        condition: service_completed_successfully

# =============================================================================
# NETWORKS & VOLUMES
# =============================================================================
networks:
  sabc-network:
    driver: bridge
    ipam:
      config:
        - subnet: 172.28.0.0/16

volumes:
  mysql_data:
    driver: local
  postgres_data:
    driver: local
  clickhouse_data:
    driver: local
  clickhouse_logs:
    driver: local
  redis_data:
    driver: local
  prometheus_data:
    driver: local
  alertmanager_data:
    driver: local
  grafana_data:
    driver: local
