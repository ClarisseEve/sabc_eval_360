services:
  frontend:
    build:
      context: ./apps/web
      dockerfile: Dockerfile
      args:
        VITE_API_URL: ${VITE_API_URL:-/api}
    container_name: sabc-frontend
    restart: unless-stopped
    ports:
      - "${WEB_PORT:-5173}:80"
    depends_on:
      api:
        condition: service_healthy
    networks:
      - sabc-network

  api:
    build:
      context: ./apps/api
      dockerfile: Dockerfile
    container_name: sabc-api
    restart: unless-stopped
    environment:
      PORT: 3000
      NODE_ENV: ${NODE_ENV:-development}
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:5173}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET est requis — copiez .env.example vers .env}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-7d}
      DATABASE_URL: ${DATABASE_URL_DOCKER:?DATABASE_URL_DOCKER est requis — copiez .env.example vers .env}
      PG_HOST: postgres
      PG_PORT: 5432
      PG_DATABASE: ${PG_DATABASE:-sabc_business}
      PG_USER: ${PG_USER:-sabc_user}
      PG_PASSWORD: ${PG_PASSWORD:?PG_PASSWORD est requis — copiez .env.example vers .env}
      CACHE_DRIVER: ${CACHE_DRIVER:-redis}
      REDIS_URL: ${REDIS_URL_DOCKER:-redis://redis:6379}
      CACHE_PREFIX: ${CACHE_PREFIX:-sabc_eval360}
      SCHEDULER_ENABLED: ${SCHEDULER_ENABLED:-true}
      # Le conteneur applique les migrations au démarrage, et peuple la base
      # au premier lancement pour disposer de comptes de démonstration.
      RUN_MIGRATIONS: ${RUN_MIGRATIONS:-true}
      RUN_SEED: ${RUN_SEED:-true}
      SEED_MODE: ${SEED_MODE:-if-empty}
      SEED_PASSWORD: ${SEED_PASSWORD:-12345}
      ALLOW_DEMO_SEED: ${ALLOW_DEMO_SEED:-true}
    ports:
      - "${API_PORT:-3000}:3000"
    volumes:
      - ./apps/web/public/images/logos/sabc-logo.png:/app/assets/sabc-logo.png:ro
    depends_on:
      mysql:
        condition: service_healthy
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://localhost:3000/api/health/live').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\""]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 60s
    networks:
      - sabc-network

  mysql:
    image: mysql:8.0
    container_name: sabc-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?MYSQL_ROOT_PASSWORD est requis — copiez .env.example vers .env}
      MYSQL_DATABASE: sabc_core
      MYSQL_USER: sabc_user
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?MYSQL_PASSWORD est requis — copiez .env.example vers .env}
    ports:
      - "${MYSQL_PORT:-3306}:3306"
    volumes:
      - mysql-data:/var/lib/mysql
      - ./docker/mysql/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -uroot -p\"$$MYSQL_ROOT_PASSWORD\" --silent"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - sabc-network

  postgres:
    image: postgres:16-alpine
    container_name: sabc-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${PG_DATABASE:-sabc_business}
      POSTGRES_USER: ${PG_USER:-sabc_user}
      POSTGRES_PASSWORD: ${PG_PASSWORD:?PG_PASSWORD est requis — copiez .env.example vers .env}
    ports:
      - "${PG_PORT_HOST:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./docker/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${PG_USER:-sabc_user} -d ${PG_DATABASE:-sabc_business}"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - sabc-network

  redis:
    image: redis:7-alpine
    container_name: sabc-redis
    restart: unless-stopped
    ports:
      - "${REDIS_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - sabc-network

volumes:
  mysql-data:
  postgres-data:

networks:
  sabc-network:
    driver: bridge
