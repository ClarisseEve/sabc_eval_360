syntax = "proto3";

package evaluation.v1;

option go_package = "github.com/sabc/evaluation-service/api/proto;evaluationpb";

import "google/protobuf/timestamp.proto";
import "google/protobuf/wrappers.proto";

// =============================================================================
// Evaluation Service - gRPC API Definition
// For internal service-to-service communication
// =============================================================================

service EvaluationService {
  // Evaluation CRUD
  rpc CreateEvaluation(CreateEvaluationRequest) returns (EvaluationResponse);
  rpc GetEvaluation(GetEvaluationRequest) returns (EvaluationResponse);
  rpc UpdateNotes(UpdateNotesRequest) returns (EvaluationResponse);
  rpc SubmitEvaluation(SubmitEvaluationRequest) returns (EvaluationResponse);
  rpc ValidateEvaluation(ValidateEvaluationRequest) returns (EvaluationResponse);

  // Queries
  rpc ListEvaluations(ListEvaluationsRequest) returns (ListEvaluationsResponse);
  rpc GetPendingEvaluations(GetPendingRequest) returns (ListEvaluationsResponse);
  rpc GetEvaluationsToValidate(GetToValidateRequest) returns (ListEvaluationsResponse);

  // Periods
  rpc GetActivePeriodes(GetActivePeriodesRequest) returns (ListPeriodesResponse);
  rpc GetPeriode(GetPeriodeRequest) returns (PeriodeResponse);

  // Scores
  rpc GetUserScore(GetUserScoreRequest) returns (ScoreResponse);
  rpc RecalculateScores(RecalculateScoresRequest) returns (RecalculateScoresResponse);

  // Permission check (for Laravel strangler)
  rpc CanCreateEvaluation(CanCreateEvaluationRequest) returns (CanCreateEvaluationResponse);
}

// =============================================================================
// Enums
// =============================================================================

enum Statut {
  STATUT_UNSPECIFIED = 0;
  STATUT_BROUILLON = 1;
  STATUT_SOUMIS = 2;
  STATUT_VALIDE = 3;
  STATUT_REJETE = 4;
}

enum TypeEvaluation {
  TYPE_UNSPECIFIED = 0;
  TYPE_AUTO = 1;
  TYPE_DESCENDANTE = 2;
  TYPE_PAIRS = 3;
  TYPE_ASCENDANTE = 4;
  TYPE_AUTRE = 5;
}

enum StatutPeriode {
  PERIODE_UNSPECIFIED = 0;
  PERIODE_PLANIFIEE = 1;
  PERIODE_OUVERTE = 2;
  PERIODE_FERMEE = 3;
  PERIODE_ARCHIVEE = 4;
}

// =============================================================================
// Messages - Domain Objects
// =============================================================================

message Note {
  string code_critere = 1;
  string nom_critere = 2;
  double note = 3;
  double ponderation = 4;
  string commentaire = 5;
  double note_maximale = 6;
}

message NotesJSON {
  repeated Note criteres = 1;
  double note_moyenne = 2;
  double note_globale = 3;
  string date_calcul = 4;
}

message Evaluation {
  string id_evaluation = 1;
  string evaluateur_matricule = 2;
  string evalue_matricule = 3;
  string id_periode = 4;
  string id_regle = 5;
  google.protobuf.Timestamp date_evaluation = 6;
  google.protobuf.Timestamp date_soumission = 7;
  google.protobuf.Timestamp date_validation = 8;
  Statut statut = 9;
  NotesJSON notes_json = 10;
  string commentaire_general = 11;
  string commentaire_validation = 12;
  google.protobuf.StringValue validateur_matricule = 13;
  google.protobuf.DoubleValue score_global = 14;
  TypeEvaluation type_evaluation = 15;
  google.protobuf.Timestamp created_at = 16;
  google.protobuf.Timestamp updated_at = 17;
}

message PeriodeEvaluation {
  string id_periode = 1;
  string code_periode = 2;
  string nom_periode = 3;
  string titre = 4;
  string description = 5;
  google.protobuf.Timestamp date_debut = 6;
  google.protobuf.Timestamp date_fin = 7;
  StatutPeriode statut = 8;
  google.protobuf.StringValue id_regle = 9;
  bool est_ouverte = 10;
  bool est_cloturee = 11;
  int32 nb_evaluations_attendues = 12;
  int32 nb_evaluations_completees = 13;
  double taux_completion = 14;
  int32 duree_rappels_jours = 15;
  int32 nb_max_rappels = 16;
  bool escalade_automatique = 17;
  int32 jours_restants = 18;
}

message ScoreUtilisateur {
  string matricule = 1;
  string id_periode = 2;
  google.protobuf.DoubleValue score_auto = 3;
  google.protobuf.DoubleValue score_pairs = 4;
  google.protobuf.DoubleValue score_manager = 5;
  google.protobuf.DoubleValue score_global = 6;
  google.protobuf.DoubleValue progression_vs_precedente = 7;
  int32 nb_evaluations_recues = 8;
  int32 nb_evaluations_donnees = 9;
  google.protobuf.Int32Value position_equipe = 10;
  bool est_complet = 11;
  google.protobuf.Timestamp derniere_maj = 12;
}

// =============================================================================
// Request/Response Messages
// =============================================================================

// Create Evaluation
message CreateEvaluationRequest {
  string evaluateur_matricule = 1;
  string evalue_matricule = 2;
  string role_evaluateur = 3;
  string role_evalue = 4;
  string id_periode = 5;
  string id_regle = 6;
}

message EvaluationResponse {
  bool success = 1;
  Evaluation data = 2;
  string message = 3;
}

// Get Evaluation
message GetEvaluationRequest {
  string id_evaluation = 1;
}

// Update Notes
message UpdateNotesRequest {
  string id_evaluation = 1;
  string user_matricule = 2;
  NotesJSON notes = 3;
  string commentaire_general = 4;
}

// Submit Evaluation
message SubmitEvaluationRequest {
  string id_evaluation = 1;
  string user_matricule = 2;
}

// Validate Evaluation
message ValidateEvaluationRequest {
  string id_evaluation = 1;
  string validateur_matricule = 2;
  bool est_valide = 3;
  string commentaire = 4;
}

// List Evaluations
message ListEvaluationsRequest {
  string matricule = 1;
  Statut statut = 2;
  TypeEvaluation type_evaluation = 3;
  string id_periode = 4;
  int32 limit = 5;
  int32 offset = 6;
}

message ListEvaluationsResponse {
  bool success = 1;
  repeated Evaluation data = 2;
  PaginationMeta meta = 3;
}

message PaginationMeta {
  int32 total = 1;
  int32 limit = 2;
  int32 offset = 3;
  bool has_more = 4;
}

// Pending Evaluations
message GetPendingRequest {
  string matricule = 1;
}

// To Validate
message GetToValidateRequest {
  string manager_matricule = 1;
}

// Periodes
message GetActivePeriodesRequest {}

message GetPeriodeRequest {
  string id_periode = 1;
}

message PeriodeResponse {
  bool success = 1;
  PeriodeEvaluation data = 2;
}

message ListPeriodesResponse {
  bool success = 1;
  repeated PeriodeEvaluation data = 2;
}

// Scores
message GetUserScoreRequest {
  string matricule = 1;
  string id_periode = 2;
}

message ScoreResponse {
  bool success = 1;
  ScoreUtilisateur data = 2;
}

message RecalculateScoresRequest {
  string id_periode = 1;
  string matricule = 2; // Optional: specific user, empty = all
}

message RecalculateScoresResponse {
  bool success = 1;
  int32 scores_updated = 2;
  string message = 3;
}

// Permission Check
message CanCreateEvaluationRequest {
  string evaluateur_matricule = 1;
  string evalue_matricule = 2;
  string role_evaluateur = 3;
  string role_evalue = 4;
  string id_periode = 5;
}

message CanCreateEvaluationResponse {
  bool allowed = 1;
  string reason = 2;
  TypeEvaluation type_evaluation = 3;
}
