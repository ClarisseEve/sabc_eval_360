; =============================================================================
; SABC Eval360 - Xdebug Configuration (Development Only)
; =============================================================================

[xdebug]
; Mode: debug, develop, coverage, gcstats, profile, trace
xdebug.mode = debug,develop

; Client settings
xdebug.client_host = host.docker.internal
xdebug.client_port = 9003
xdebug.discover_client_host = false

; Idekey for IDE connection
xdebug.idekey = VSCODE

; Start with request trigger
xdebug.start_with_request = trigger

; Output settings
xdebug.output_dir = /tmp/xdebug

; Display settings (develop mode)
xdebug.var_display_max_children = 128
xdebug.var_display_max_data = 512
xdebug.var_display_max_depth = 4

; Log settings
xdebug.log = /var/log/php/xdebug.log
xdebug.log_level = 3

; Profiler settings (when mode includes profile)
xdebug.profiler_output_name = cachegrind.out.%p.%H.%R

; Coverage settings (when mode includes coverage)
xdebug.coverage_enable_dead_code_analysis = 1
