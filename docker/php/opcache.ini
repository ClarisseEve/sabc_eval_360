; =============================================================================
; SABC Eval360 - OPcache Configuration
; =============================================================================

[opcache]
; Enable OPcache
opcache.enable = 1
opcache.enable_cli = 1

; Memory settings
opcache.memory_consumption = 256
opcache.interned_strings_buffer = 32
opcache.max_accelerated_files = 20000

; Validation settings
; Production: 0 (disable file timestamp validation for performance)
; Development: 2 (validate files on every request)
opcache.validate_timestamps = 0
opcache.revalidate_freq = 0

; Optimization settings
opcache.optimization_level = 0x7FFEBFFF
opcache.save_comments = 1
opcache.fast_shutdown = 1

; JIT settings (PHP 8.0+)
opcache.jit = 1255
opcache.jit_buffer_size = 128M

; File cache (persistent cache across restarts)
opcache.file_cache = /tmp/opcache
opcache.file_cache_only = 0
opcache.file_cache_consistency_checks = 1

; Preloading (Laravel optimization)
; Uncomment after generating preload file with: php artisan optimize
; opcache.preload = /var/www/html/bootstrap/cache/preload.php
; opcache.preload_user = www-data

; Logging
opcache.log_verbosity_level = 1
opcache.error_log = /var/log/php/opcache.log

; Huge pages (if available on host)
opcache.huge_code_pages = 0
