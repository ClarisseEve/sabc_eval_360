# =============================================================================
# SABC Eval360 - Traefik Configuration
# API Gateway for Microservices Architecture
# =============================================================================

# Global configuration
global:
  checkNewVersion: false
  sendAnonymousUsage: false

# API Dashboard (accessible via traefik.localhost:8080)
api:
  dashboard: true
  insecure: true  # Set to false in production with proper auth

# Entry points definition (all in one block - YAML doesn't allow duplicate keys)
entryPoints:
  web:
    address: ":80"
    # HTTPS redirect disabled for local development
    # Uncomment for production:
    # http:
    #   redirections:
    #     entryPoint:
    #       to: websecure
    #       scheme: https
    #       permanent: false
  websecure:
    address: ":443"
    # TLS disabled for local development
    # Uncomment for production:
    # http:
    #   tls:
    #     certResolver: letsencrypt
  # Monitoring entry points
  metrics:
    address: ":8082"
  ping:
    address: ":8083"

# Providers
providers:
  docker:
    endpoint: "unix:///var/run/docker.sock"
    exposedByDefault: false
    network: sabc-network
    watch: true

# Logging
log:
  level: INFO
  format: json

accessLog:
  format: json
  filters:
    statusCodes:
      - "200-299"
      - "400-499"
      - "500-599"
  fields:
    headers:
      names:
        X-Service-Key: redact
        Authorization: redact

# Metrics for Prometheus
metrics:
  prometheus:
    entryPoint: metrics
    addEntryPointsLabels: true
    addServicesLabels: true
    buckets:
      - 0.1
      - 0.3
      - 1.2
      - 5.0

# Health check endpoint
ping:
  entryPoint: ping

# Middlewares configuration (global defaults)
http:
  middlewares:
    # Security headers
    security-headers:
      headers:
        browserXssFilter: true
        contentTypeNosniff: true
        frameDeny: true
        stsIncludeSubdomains: true
        stsPreload: true
        stsSeconds: 31536000
        customFrameOptionsValue: "SAMEORIGIN"

    # Rate limiting for API
    api-ratelimit:
      rateLimit:
        average: 100
        burst: 50
        period: 1s

    # Rate limiting for microservices
    microservice-ratelimit:
      rateLimit:
        average: 200
        burst: 100
        period: 1s

    # Compression
    compress:
      compress:
        excludedContentTypes:
          - text/event-stream

    # Retry on failure
    retry:
      retry:
        attempts: 3
        initialInterval: 100ms

    # Circuit breaker
    circuit-breaker:
      circuitBreaker:
        expression: "NetworkErrorRatio() > 0.30 || ResponseCodeRatio(500, 600, 0, 600) > 0.25"

# Tracing with Jaeger
tracing:
  jaeger:
    samplingServerURL: "http://jaeger:5778/sampling"
    samplingType: const
    samplingParam: 1.0
    localAgentHostPort: "jaeger:6831"
    propagation: jaeger
    traceContextHeaderName: uber-trace-id
