# =============================================================================
# SABC Eval360 - Prometheus Alert Rules
# Evaluation Service & Business Metrics Alerts
# =============================================================================

groups:
  # ===========================================================================
  # Service Health Alerts
  # ===========================================================================
  - name: service_health
    interval: 30s
    rules:
      - alert: ServiceDown
        expr: up == 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "Service {{ $labels.job }} is down"
          description: "{{ $labels.job }} has been down for more than 1 minute."

      - alert: HighErrorRate
        expr: |
          sum(rate(http_requests_total{status="5xx"}[5m])) by (job)
          /
          sum(rate(http_requests_total[5m])) by (job)
          > 0.05
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "High error rate on {{ $labels.job }}"
          description: "Error rate is {{ $value | humanizePercentage }} on {{ $labels.job }}."

      - alert: CriticalErrorRate
        expr: |
          sum(rate(http_requests_total{status="5xx"}[5m])) by (job)
          /
          sum(rate(http_requests_total[5m])) by (job)
          > 0.10
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "Critical error rate on {{ $labels.job }}"
          description: "Error rate exceeded 10% on {{ $labels.job }}. Current: {{ $value | humanizePercentage }}."

  # ===========================================================================
  # Latency Alerts
  # ===========================================================================
  - name: latency_alerts
    interval: 30s
    rules:
      - alert: HighLatencyP95
        expr: |
          histogram_quantile(0.95, sum(rate(http_request_duration_seconds_bucket[5m])) by (le, job))
          > 2
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "High P95 latency on {{ $labels.job }}"
          description: "P95 latency is {{ $value | humanizeDuration }} on {{ $labels.job }}."

      - alert: CriticalLatencyP99
        expr: |
          histogram_quantile(0.99, sum(rate(http_request_duration_seconds_bucket[5m])) by (le, job))
          > 5
        for: 3m
        labels:
          severity: critical
        annotations:
          summary: "Critical P99 latency on {{ $labels.job }}"
          description: "P99 latency exceeded 5s on {{ $labels.job }}. Current: {{ $value | humanizeDuration }}."

      # Target from perf-rules.md: <200ms DB queries
      - alert: SlowDatabaseQueries
        expr: |
          histogram_quantile(0.95, sum(rate(db_query_duration_seconds_bucket[5m])) by (le, job))
          > 0.2
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Slow database queries on {{ $labels.job }}"
          description: "P95 DB query time is {{ $value | humanizeDuration }}, exceeds 200ms target."

  # ===========================================================================
  # Database Alerts
  # ===========================================================================
  - name: database_alerts
    interval: 60s
    rules:
      - alert: ClickHouseDown
        expr: db_connection_up{database="clickhouse"} == 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "ClickHouse is down"
          description: "ClickHouse analytics database is unreachable."

      - alert: PostgreSQLDown
        expr: db_connection_up{database="postgresql"} == 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "PostgreSQL is down"
          description: "PostgreSQL business database is unreachable."

      - alert: MySQLDown
        expr: db_connection_up{database="mysql"} == 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "MySQL is down"
          description: "MySQL core database is unreachable."

      - alert: HighDatabaseConnections
        expr: |
          sum(db_connections_active) by (database)
          /
          sum(db_connections_max) by (database)
          > 0.8
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "High database connections on {{ $labels.database }}"
          description: "Connection pool usage is {{ $value | humanizePercentage }}."

  # ===========================================================================
  # Business Metrics Alerts (Evaluations)
  # ===========================================================================
  - name: business_alerts
    interval: 5m
    rules:
      - alert: LowEvaluationCompletionRate
        expr: |
          sum(evaluations_completed_total) by (periode)
          /
          sum(evaluations_expected_total) by (periode)
          < 0.5
        for: 1h
        labels:
          severity: warning
          team: hr
        annotations:
          summary: "Low evaluation completion rate for {{ $labels.periode }}"
          description: "Only {{ $value | humanizePercentage }} of evaluations completed for period {{ $labels.periode }}."

      - alert: EvaluationDeadlineApproaching
        expr: |
          (evaluation_deadline_timestamp - time()) / 86400 < 7
          and
          sum(evaluations_completed_total) by (periode)
          /
          sum(evaluations_expected_total) by (periode)
          < 0.8
        for: 1h
        labels:
          severity: warning
          team: hr
        annotations:
          summary: "Evaluation deadline approaching for {{ $labels.periode }}"
          description: "Less than 7 days until deadline with only {{ $value | humanizePercentage }} completion."

      - alert: AnomalyDetectionHigh
        expr: sum(anomalies_detected_total{severity="high"}) > 10
        for: 30m
        labels:
          severity: warning
          team: analytics
        annotations:
          summary: "High number of anomalies detected"
          description: "{{ $value }} high-severity anomalies detected in the last 30 minutes."

  # ===========================================================================
  # Infrastructure Alerts
  # ===========================================================================
  - name: infrastructure_alerts
    interval: 30s
    rules:
      - alert: HighMemoryUsage
        expr: |
          (1 - (node_memory_MemAvailable_bytes / node_memory_MemTotal_bytes)) > 0.85
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "High memory usage on {{ $labels.instance }}"
          description: "Memory usage is {{ $value | humanizePercentage }}."

      - alert: HighCPUUsage
        expr: |
          100 - (avg by(instance) (rate(node_cpu_seconds_total{mode="idle"}[5m])) * 100) > 80
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "High CPU usage on {{ $labels.instance }}"
          description: "CPU usage is {{ $value | humanize }}%."

      - alert: DiskSpaceLow
        expr: |
          (node_filesystem_avail_bytes{fstype!~"tmpfs|overlay"}
          /
          node_filesystem_size_bytes{fstype!~"tmpfs|overlay"}) < 0.15
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Low disk space on {{ $labels.instance }}"
          description: "Only {{ $value | humanizePercentage }} disk space remaining on {{ $labels.mountpoint }}."

      - alert: RedisMemoryHigh
        expr: redis_memory_used_bytes / redis_memory_max_bytes > 0.9
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Redis memory usage high"
          description: "Redis is using {{ $value | humanizePercentage }} of max memory."

  # ===========================================================================
  # Queue Alerts (Laravel Horizon)
  # ===========================================================================
  - name: queue_alerts
    interval: 60s
    rules:
      - alert: QueueBacklogHigh
        expr: laravel_queue_size{queue=~"evaluations|analytics"} > 1000
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "High queue backlog on {{ $labels.queue }}"
          description: "Queue {{ $labels.queue }} has {{ $value }} pending jobs."

      - alert: QueueJobsFailing
        expr: |
          rate(laravel_queue_jobs_failed_total[5m]) > 0.1
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Queue jobs failing"
          description: "Failed job rate is {{ $value }} per second."

      - alert: WorkerDown
        expr: laravel_horizon_workers < 1
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "No Horizon workers running"
          description: "All Laravel Horizon workers are down."
