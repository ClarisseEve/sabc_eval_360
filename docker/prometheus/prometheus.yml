# =============================================================================
# Prometheus Configuration for SABC Eval360
# Phase 4: Observability & Monitoring
# =============================================================================

global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    monitor: 'sabc-eval360'
    environment: 'production'

# Alertmanager configuration
alerting:
  alertmanagers:
    - static_configs:
        - targets: ['alertmanager:9093']

# Alert rules files
rule_files:
  - '/etc/prometheus/alerts/*.yml'

scrape_configs:
  # Prometheus self-monitoring
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  # Traefik Gateway metrics
  - job_name: 'traefik'
    static_configs:
      - targets: ['gateway:8080']

  # Laravel Application (via custom metrics endpoint)
  - job_name: 'laravel-app'
    metrics_path: '/metrics'
    static_configs:
      - targets: ['core-app:80']

  # Redis metrics (redis_exporter)
  - job_name: 'redis'
    static_configs:
      - targets: ['redis-exporter:9121']

  # MySQL metrics (requires mysqld_exporter)
  # - job_name: 'mysql'
  #   static_configs:
  #     - targets: ['mysql-exporter:9104']

  # ClickHouse metrics
  - job_name: 'clickhouse'
    static_configs:
      - targets: ['clickhouse:9363']
    metrics_path: '/metrics'

  # Microservices
  - job_name: 'evaluation-service'
    static_configs:
      - targets: ['evaluation-service:8080']
    metrics_path: '/metrics'

  - job_name: 'analytics-service'
    static_configs:
      - targets: ['analytics-service:8080']
    metrics_path: '/metrics'
