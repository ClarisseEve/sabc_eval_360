x-api-environment: &api-environment
  NODE_ENV: production
  PORT: 3000
  FRONTEND_URL: ${FRONTEND_URL:-http://localhost:5173}
  JWT_SECRET: ${JWT_SECRET:?JWT_SECRET est requis — copiez .env.example vers .env}
  JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-7d}
  DATABASE_URL: ${DATABASE_URL_DOCKER:?DATABASE_URL_DOCKER est requis — copiez .env.example vers .env}
  PG_HOST: postgres
  PG_PORT: 5432
  PG_DATABASE: ${PG_DATABASE:-sabc_business}
  PG_USER: ${PG_USER:-sabc_user}
  PG_PASSWORD: ${PG_PASSWORD:?PG_PASSWORD est requis — copiez .env.example vers .env}
  CACHE_DRIVER: redis
  REDIS_URL: ${REDIS_URL_DOCKER:-redis://redis:6379}
  CACHE_PREFIX: ${CACHE_PREFIX:-sabc_eval360}
  ANALYTICS_MICROSERVICE_ENABLED: "false"
  SCHEDULER_ENABLED: "false"

services:
  frontend:
    build:
      context: ./apps/web
      dockerfile: Dockerfile
      args:
        VITE_API_URL: ${VITE_API_URL:-/api}
    ports:
      - "${WEB_PORT:-5173}:80"
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - sabc-scale-network

  api:
    image: nginx:1.27-alpine
    ports:
      - "${API_PORT:-3000}:3000"
    volumes:
      - ./docker/nginx-api-gateway/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      nestjs-api-1:
        condition: service_healthy
      nestjs-api-2:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3000/health/live >/dev/null 2>&1 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped
    networks:
      - sabc-scale-network

  migrate:
    build:
      context: ./apps/api
      dockerfile: Dockerfile
    environment:
      <<: *api-environment
      RUN_MIGRATIONS: "true"
      RUN_SEED: "false"
      SCHEDULER_ENABLED: "false"
    command: ["sh", "-c", "echo '[migrate] Schémas MySQL et PostgreSQL à jour'"]
    depends_on:
      mysql:
        condition: service_healthy
      postgres:
        condition: service_healthy
    restart: "no"
    networks:
      - sabc-scale-network

  nestjs-api-1:
    build:
      context: ./apps/api
      dockerfile: Dockerfile
    environment:
      <<: *api-environment
      RUN_MIGRATIONS: "false"
      RUN_SEED: "false"
      SCHEDULER_ENABLED: "true"
    expose:
      - "3000"
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/health/live').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped
    networks:
      - sabc-scale-network

  nestjs-api-2:
    build:
      context: ./apps/api
      dockerfile: Dockerfile
    environment:
      <<: *api-environment
      RUN_MIGRATIONS: "false"
      RUN_SEED: "false"
      SCHEDULER_ENABLED: "false"
    expose:
      - "3000"
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/health/live').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped
    networks:
      - sabc-scale-network

  mysql:
    image: mysql:8.0
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?MYSQL_ROOT_PASSWORD est requis — copiez .env.example vers .env}
      MYSQL_DATABASE: sabc_core
      MYSQL_USER: sabc_user
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?MYSQL_PASSWORD est requis — copiez .env.example vers .env}
    ports:
      - "${MYSQL_PORT:-3306}:3306"
    volumes:
      - mysql-data:/var/lib/mysql
      - ./docker/mysql/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -uroot -p\"$$MYSQL_ROOT_PASSWORD\" --silent"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - sabc-scale-network

  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${PG_DATABASE:-sabc_business}
      POSTGRES_USER: ${PG_USER:-sabc_user}
      POSTGRES_PASSWORD: ${PG_PASSWORD:?PG_PASSWORD est requis — copiez .env.example vers .env}
    ports:
      - "${PG_PORT_HOST:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./docker/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${PG_USER:-sabc_user} -d ${PG_DATABASE:-sabc_business}"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - sabc-scale-network

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "${REDIS_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - sabc-scale-network

volumes:
  mysql-data:
  postgres-data:

networks:
  sabc-scale-network:
    driver: bridge
